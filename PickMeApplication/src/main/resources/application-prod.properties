# Production Configuration for Render deployment

# Database Configuration - Neon PostgreSQL (Production)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (Production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

# Connection Pool Optimization for Render
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Configuration (Render uses PORT environment variable)
server.address=0.0.0.0
server.port=${PORT:8080}

# CORS Configuration for production
app.cors.allowed-origins=${CORS_ORIGINS:https://pickme-frontend.vercel.app}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application Settings
app.email.from=${MAIL_USERNAME}
app.email.name=PickMe Application
app.base-url=${APP_BASE_URL}

# SePay Configuration
sepay.bank.name=${SEPAY_BANK_NAME:VPBank}
sepay.account.number=${SEPAY_ACCOUNT_NUMBER}
sepay.account.holder=${SEPAY_ACCOUNT_HOLDER}
sepay.qr.base.url=https://qr.sepay.vn
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET}
sepay.webhook.url=${SEPAY_WEBHOOK_URL}

# Payment Configuration
payment.expiry.minutes=15
payment.auto.expire=true

# Security
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Swagger/OpenAPI Configuration (Enable for testing)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Production optimizations
spring.jpa.open-in-view=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024